<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MULTIPUNTO</title>
    <!-- Fuente Phosphor (iconos) -->
    <link rel="stylesheet" href="https://unpkg.com/phosphor-icons@2.1.1/src/css/phosphor.css" />
    <!-- Fuente personalizada (si tienes Autobús Ómnibus, la cargas aquí) -->
    <style>
        /* ========== ESTILOS GENERALES ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;      /* fondo negro */
            color: #FFFFFF;                /* texto blanco */
            font-family: 'Autobús Ómnibus', Arial, sans-serif; /* si no la tienes, usará Arial */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        /* Contenedor principal */
        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        /* Logo y título */
        .logo {
            width: 120px;               /* ajusta según tu logo */
            height: auto;
            margin-bottom: 0.5rem;
        }
        .nombre-emprendimiento {
            font-size: 2.5rem;
            font-weight: bold;
            color: #FFFFFF;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }
        .descripcion {
            font-size: 1.1rem;
            color: #CCCCCC;            /* gris claro para contraste */
            margin-bottom: 2.5rem;
            font-weight: 300;
        }

        /* ========== TARJETAS (CARDS) ========== */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .card {
            background-color: #FFFFFF;
            color: #000000;
            border-radius: 16px;
            padding: 1.5rem 1rem;
            text-align: center;
            text-decoration: none;        /* quita subrayado del enlace */
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 2px solid #1800FF;    /* borde azul eléctrico */
            box-shadow: 0 8px 0 #1800FF;  /* sombra para efecto 3D */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 0 #1800FF;
        }

        /* Icono (Phosphor) */
        .card i {
            font-size: 3.5rem;
            color: #1800FF;              /* azul eléctrico */
            margin-bottom: 0.5rem;
        }

        .card .red-social {
            font-size: 1.2rem;
            font-weight: 600;
            color: #000000;
        }

        .card .usuario {
            font-size: 0.9rem;
            color: #666666;              /* gris oscuro */
            margin-top: 0.2rem;
        }

        /* ========== PIE DE PÁGINA ========== */
        .footer {
            margin-top: 3rem;
            font-size: 0.9rem;
            color: #888888;
            border-top: 1px solid #333333;
            padding-top: 1.5rem;
            width: 100%;
        }

        /* ========== RESPONSIVE (para móviles) ========== */
        @media (max-width: 500px) {
            .nombre-emprendimiento {
                font-size: 2rem;
            }
            .cards {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <!-- 🔹 LOGO (cambia la ruta por la tuya) -->
        <img src="logo_multipunto.png" alt="Logo" class="logo" />
        <h1 class="nombre-emprendimiento">MULTIPUNTO</h1>
        <p class="descripcion">Impresión de documentos y servicios varios</p>

        <!-- 🔹 TARJETAS DE REDES SOCIALES -->
        <div class="cards">

            <!-- Facebook -->
            <a href="https://www.facebook.com/share/1K3kUguy7p/" target="_blank" class="card">
                <i class="ph ph-facebook-logo"></i>
                <span class="red-social">Facebook</span>
                <span class="usuario">@ce</span>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/multipunto.stgodecuba?igsi=MXY2cnI0aTlsYzQ5bA==" target="_blank" class="card">
                <i class="ph ph-instagram-logo"></i>
                <span class="red-social">Instagram</span>
                <span class="usuario">@multipunto.stgodecuba</span>
            </a>

            <!-- YouTube -->
            <a href="" target="_blank" class="card">
                <i class="ph ph-youtube-logo"></i>
                <span class="red-social">YouTube</span>
                <span class="usuario">EN CONSTRUCCIÓN</span>
            </a>

            <!-- WhatsApp -->
            <a href="https://wa.me/5358815215" target="_blank" class="card">
                <i class="ph ph-whatsapp-logo"></i>
                <span class="red-social">WhatsApp</span>
                <span class="usuario">+5358815215</span>
            </a>

            <!-- Email -->
            <a href="mailto:multipunto.admin@gmail.com" class="card">
                <i class="ph ph-envelope"></i>
                <span class="red-social">Email</span>
                <span class="usuario">multipunto.admin@gmail.com</span>
            </a>

            <!-- Threads -->
            <a href="https://threads.net/@tusuario" target="_blank" class="card">
                <i class="ph ph-threads-logo"></i>
                <span class="red-social">Threads</span>
                <span class="usuario">EN CONSTRUCCIÓN</span>
            </a>

        </div>

        <div class="footer">
            © 2026 📍MULTIPUNTO Santiago de Cuba - Impresión de documentos y servicios varios 
        </div>
    </div>
</body>
</html>
